name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege — every job here only reads the repo (lint / audit / scan / typecheck).
permissions:
  contents: read

jobs:
  rust-build:
    name: Rust build (cargo build-sbf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.12/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo build-sbf
        run: cargo build-sbf

      - name: Upload program binary
        uses: actions/upload-artifact@v4
        with:
          name: terminuscoin.so
          path: target/deploy/terminuscoin.so
          retention-days: 7

  clippy:
    name: Clippy (program lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}

      # Clippy compiles for the host target (no build-sbf / Solana CLI needed).
      # -D warnings        → any lint fails the build (fully unrestricted).
      # -A unexpected_cfgs → silence Anchor's `anchor-debug` cfg noise emitted by
      #                      every #[derive(Accounts)] macro (not our code).
      - name: cargo clippy
        run: >
          cargo clippy --workspace --all-targets --
          -D warnings
          -A unexpected_cfgs

  cargo-audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # --deny warnings → unmaintained/unsound advisories fail the build too, not
      # just active vulnerabilities — so a NEW advisory anywhere in the tree is
      # caught. The --ignore list below holds the only known exceptions: all are
      # TRANSITIVE through anchor-lang / solana-program / mpl-token-metadata and
      # cannot be fixed from this repo (confirmed via `cargo tree -i`). Re-check
      # each when bumping Anchor/Solana — drop the ignore once upstream updates.
      #   RUSTSEC-2025-0141  bincode 1.3.3       unmaintained (via anchor-lang)
      #   RUSTSEC-2025-0161  libsecp256k1 0.6.0  unmaintained (via solana-program)
      #   RUSTSEC-2026-0097  rand 0.7/0.8        unsound      (via solana-program)
      #   RUSTSEC-2026-0190  anyhow 1.0.102      unsound      (via anchor-lang proc-macros; build-time only, not in the BPF program)
      - name: cargo audit
        run: >
          cargo audit --deny warnings
          --ignore RUSTSEC-2025-0141
          --ignore RUSTSEC-2025-0161
          --ignore RUSTSEC-2026-0097
          --ignore RUSTSEC-2026-0190

  sec3-xray:
    name: Sec3 X-Ray (Solana static analysis)
    runs-on: ubuntu-latest   # GitHub runners ship Docker; nothing to install
    # Sec3 X-Ray CLI (github.com/sec3-product/x-ray) — open-source, no token.
    # GATES CI: X-Ray is informational (exits 0 even when it reports findings),
    # so the step greps the report and FAILS on any finding beyond the baselined
    # false positive — one IntegerDivOverflow in lucky_reward (`u64::MAX /
    # difficulty`: unsigned div can't overflow; the `difficulty <= 1` guard makes
    # difficulty >= 2, so no divide-by-zero). Update the baseline below if the
    # program's accepted-FP set legitimately changes. Pinned to a release tag.
    steps:
      - uses: actions/checkout@v4

      - name: Run X-Ray scan + gate on new findings
        run: |
          # 2>&1 is REQUIRED: X-Ray prints the "VULNERABLE: <name>" detector marker
          # to stderr and "Found a potential vulnerability" to stdout (streams stay
          # split), and `| tee` captures only stdout — so without 2>&1 the marker is
          # missing from the report and the gate fails on the baseline. Merge both.
          docker run --rm --volume "${{ github.workspace }}:/workspace" \
            ghcr.io/sec3-product/x-ray:v0.0.6 \
            /workspace/programs/terminuscoin 2>&1 | tee xray-report.txt || true
          # Fail loud if the scan produced nothing recognizable (image-pull failure
          # / crash) — otherwise an empty report reads as FOUND=0 = "clean" (fail-open).
          grep -qE "Detecting Vulnerabilities|attack surface|summary of potential vulnerabilities" xray-report.txt \
            || { echo "::error::X-Ray produced no recognizable output — scan likely failed."; exit 1; }
          # Baseline = exactly one accepted false positive (IntegerDivOverflow).
          FOUND=$(grep -c "Found a potential vulnerability" xray-report.txt || true)
          echo "X-Ray findings: ${FOUND:-0} (baseline: 1 known IntegerDivOverflow FP)"
          if [ "${FOUND:-0}" -gt 1 ] || { [ "${FOUND:-0}" -eq 1 ] && ! grep -q "VULNERABLE: IntegerDivOverflow" xray-report.txt; }; then
            echo "::error::X-Ray surfaced a finding beyond the baselined IntegerDivOverflow false positive — see the xray-report artifact."
            grep -E "VULNERABLE:|Found a potential vulnerability" xray-report.txt || true
            exit 1
          fi
          echo "X-Ray gate passed — no new findings (only the known FP, or none)."

      - name: Upload X-Ray report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-report
          path: xray-report.txt
          retention-days: 14

  ts-typecheck:
    name: TypeScript typecheck (miner-ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miner-ui/package-lock.json

      - name: Install
        working-directory: miner-ui
        run: npm ci --legacy-peer-deps

      - name: Typecheck (src)
        working-directory: miner-ui
        run: npx tsc --noEmit

      - name: Typecheck (api — Vercel functions)
        working-directory: miner-ui
        run: npx tsc -p tsconfig.api.json --noEmit

      - name: Build
        working-directory: miner-ui
        run: npx vite build

  integration-tests:
    name: Anchor integration tests (local validator)
    runs-on: ubuntu-latest
    # The behavioural suite — the only job that actually executes program logic.
    # Everything above it checks that the code builds, lints and type-checks;
    # nothing above it would catch an emission-math or authority-state-machine
    # regression. Runs the same `yarn test` a developer runs locally.
    timeout-minutes: 45
    env:
      PROGRAM_ID: FfA5srQxRjZtTpZ1qq2Rivkp6PaRRii3R9712onMJH5Y
      ANCHOR_VERSION: 0.32.1
      SOLANA_VERSION: v3.1.12
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # anchor-cli builds from source (~15 min cold). Cached on the pinned
      # version so only the first run on a new version pays for it.
      - name: Cache anchor-cli
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: ${{ runner.os }}-anchor-cli-${{ env.ANCHOR_VERSION }}

      # anchor-cli links hidapi (Ledger support, via solana-remote-wallet),
      # whose build script needs libudev from pkg-config; the runner image
      # ships neither the headers nor the .pc file.
      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
          cargo install --git https://github.com/coral-xyz/anchor \
            --tag "v${ANCHOR_VERSION}" anchor-cli --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install node deps
        run: yarn install --frozen-lockfile

      # Produces target/deploy/terminuscoin.so, target/idl/terminuscoin.json and
      # target/types/terminuscoin.ts. The tests import the generated types and
      # resolve the program through `anchor.workspace`, so cargo build-sbf alone
      # (the rust-build job) is not enough here.
      - name: anchor build
        run: anchor build

      # The deployer keypair is a secret and is NOT in the repo, so the program
      # cannot be deployed to its declared address with `solana program deploy`.
      # --bpf-program loads the binary at a chosen address at genesis instead,
      # which is exactly the address declare_id! bakes into the binary.
      - name: Start local validator
        run: |
          solana-test-validator --reset --quiet \
            --bpf-program "$PROGRAM_ID" target/deploy/terminuscoin.so \
            > validator.log 2>&1 &
          echo "Waiting for validator to accept RPC..."
          for i in $(seq 1 60); do
            if solana cluster-version --url http://127.0.0.1:8899 >/dev/null 2>&1; then
              echo "Validator up after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Validator did not become ready within 60s."
          tail -50 validator.log
          exit 1

      # yarn test hardcodes this exact path (see package.json).
      - name: Create and fund test wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent \
            --outfile "$HOME/.config/solana/devnet-wallet.json"
          solana airdrop 100 \
            --keypair "$HOME/.config/solana/devnet-wallet.json" \
            --url http://127.0.0.1:8899

      - name: Verify program is loaded at the declared address
        run: |
          # --keypair: even read-only `program show` refuses to run without a
          # signer, and the runner has no default ~/.config/solana/id.json.
          solana program show "$PROGRAM_ID" --url http://127.0.0.1:8899 \
            --keypair "$HOME/.config/solana/devnet-wallet.json" \
            || { echo "::error::Program not found at $PROGRAM_ID — --bpf-program load failed."; tail -50 validator.log; exit 1; }

      - name: yarn test
        run: yarn test

      # The validator log is the only way to read a program panic after the fact.
      - name: Upload validator log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validator-log
          path: validator.log
          retention-days: 7
