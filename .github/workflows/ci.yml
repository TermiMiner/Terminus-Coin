name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust-build:
    name: Rust build (cargo build-sbf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo build-sbf
        run: cargo build-sbf

      - name: Upload program binary
        uses: actions/upload-artifact@v4
        with:
          name: terminuscoin.so
          path: target/deploy/terminuscoin.so
          retention-days: 7

  clippy:
    name: Clippy (program lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}

      # Clippy compiles for the host target (no build-sbf / Solana CLI needed).
      # -D warnings        → any lint fails the build (fully unrestricted).
      # -A unexpected_cfgs → silence Anchor's `anchor-debug` cfg noise emitted by
      #                      every #[derive(Accounts)] macro (not our code).
      - name: cargo clippy
        run: >
          cargo clippy --workspace --all-targets --
          -D warnings
          -A unexpected_cfgs

  cargo-audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # --deny warnings → unmaintained/unsound advisories fail the build too, not
      # just active vulnerabilities — so a NEW advisory anywhere in the tree is
      # caught. The --ignore list below holds the only known exceptions: all are
      # TRANSITIVE through anchor-lang / solana-program / mpl-token-metadata and
      # cannot be fixed from this repo (confirmed via `cargo tree -i`). Re-check
      # each when bumping Anchor/Solana — drop the ignore once upstream updates.
      #   RUSTSEC-2025-0141  bincode 1.3.3       unmaintained (via anchor-lang)
      #   RUSTSEC-2025-0161  libsecp256k1 0.6.0  unmaintained (via solana-program)
      #   RUSTSEC-2026-0097  rand 0.7/0.8        unsound      (via solana-program)
      - name: cargo audit
        run: >
          cargo audit --deny warnings
          --ignore RUSTSEC-2025-0141
          --ignore RUSTSEC-2025-0161
          --ignore RUSTSEC-2026-0097

  sec3-xray:
    name: Sec3 X-Ray (Solana static analysis)
    runs-on: ubuntu-latest
    # Requires a Sec3 token in repo secrets as SEC3_AUTH. The job SKIPS cleanly
    # (does not fail CI) until the secret is set — so the rest of CI is unblocked
    # while X-Ray is being provisioned. Get a token at https://app.sec3.dev and
    # add it: Settings → Secrets and variables → Actions → New repository secret.
    # NOTE: "X-ray" is assumed to mean Sec3 X-Ray (sec3.dev, formerly Soteria) —
    # the Solana program scanner. Swap this job if a different tool was meant.
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Sec3 token
        id: sec3
        run: |
          if [ -n "${{ secrets.SEC3_AUTH }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SEC3_AUTH secret not set — skipping Sec3 X-Ray scan."
          fi

      - name: Run Sec3 X-Ray scan
        if: steps.sec3.outputs.enabled == 'true'
        uses: sec3dev/pro-action@v1
        with:
          sec3-token: ${{ secrets.SEC3_AUTH }}
          path: programs/terminuscoin

  ts-typecheck:
    name: TypeScript typecheck (miner-ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miner-ui/package-lock.json

      - name: Install
        working-directory: miner-ui
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        working-directory: miner-ui
        run: npx tsc --noEmit

      - name: Build
        working-directory: miner-ui
        run: npx vite build
